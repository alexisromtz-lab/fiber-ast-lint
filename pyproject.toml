[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiber-ast-lint"
version = "0.4.4"
description = "Static detection of lossy key projections: names the dict writes that fuse two rows into one key, and checks whether a whitelist can ever be a transversal."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Platino Labs"}]
keywords = ["ast", "static-analysis", "linter", "collision", "injectivity", "data-quality"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
fiber-ast-lint = "fiber_ast_lint.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/alexisromtz-lab/fiber-ast-lint"
Repository = "https://github.com/alexisromtz-lab/fiber-ast-lint"
Issues = "https://github.com/alexisromtz-lab/fiber-ast-lint/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
