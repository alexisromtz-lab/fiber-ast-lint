# HUELLA-COMPUERTA-UNA-LINEA-20261127
# La compuerta vive en frontera-runner y se referencia por pin; aqui no se copia.
# Scope declarado: `bench/` cuenta una poblacion de benchmark y `tests/` mide fixtures,
# ninguno fabrica una metrica. La superficie de producto, incluidos modulos nuevos en la
# raiz, queda dentro.
name: ceros

# Un solo disparador: la base de un PR tiene sha; un dispatch no, y una compuerta que no
# sabe contra que resta no publica un veredicto, publica una conjetura.
on:
  pull_request:

jobs:
  ceros:
    uses: alexisromtz-lab/frontera-runner/.github/workflows/reusable-ceros.yml@v0.2.1
    with:
      excluir: "bench,tests"
      # `a.llamadas` es un contador, no una metrica del repo: `.get(clave, 0)` es su forma
      # de sumar y el cero es el estado inicial legitimo. Las dos expresiones van por
      # `permitir` —una por linea— porque llevan coma dentro y `permitidos` se parte por
      # comas: ahi quedarian en fragmentos que no casan con nada.
      # Cualquier otro cero, y cualquier cambio en estas dos lineas, sigue siendo hallazgo.
      permitir: |
        a.llamadas.get(n.func.id, 0)
        a.llamadas.get(loc.fn, 0)
        registro.get("saldo_pendiente", 0)
