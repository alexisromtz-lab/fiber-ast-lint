name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: unit tests
        run: pytest -q
      - name: the exit code is the contract
        run: |
          set +e
          fiber-ast-lint tests/fixtures -q
          rc=$?
          echo "rc=$rc"
          test "$rc" -eq 1
      - name: empty universe is not success
        run: |
          mkdir -p /tmp/vacio
          set +e
          fiber-ast-lint /tmp/vacio -q
          rc=$?
          echo "rc=$rc"
          test "$rc" -eq 2

  replay-censo:
    # The census is a claim about wheels. If it only reproduces on the author's
    # machine it is a testimony, so the reader runs here, against PyPI, on every
    # push. Layout: 0 identical, 1 diverged, 2 unreachable, 4 the pin ruptured.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: re-derive censo.json from the artifacts it names
        run: python bench/replay_censo.py
